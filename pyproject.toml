[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forwardgal"
version = "0.0.1"
description = "Forward modelling of cluster-lensed galaxies with fixed deflection maps"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Erik Solhaug" }]
# Dependencies are added milestone by milestone, when first needed.
dependencies = [
    "numpy",
    "astropy",
    "matplotlib",
    "jax",  # differentiable source model (M3)
    "scipy",  # mask dilation (regions.py)
    "optax",  # gradient-based optimizers (M10)
    "numpyro",  # NUTS sampling (M11)
    "corner",  # corner plots of posterior samples (M11)
    "pyyaml",  # model files and fit history (M13)
]

[project.optional-dependencies]
gui = [
    "pyside6",  # the desktop GUI (M15): python -m forwardgal.gui
    "pyqtgraph",  # fast image panels and draggable ellipses (G1)
]
test = [
    "pytest",
    "lenstronomy",  # independent cross-check of lensed images; tests only
]

[tool.hatch.build.targets.wheel]
packages = ["src/forwardgal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Harmless FITS-header notes from astropy (JWST date/observatory keywords, the old
    # RADECSYS spelling); positions are unaffected. Other warnings stay visible.
    "ignore:'datfix' made the change:astropy.wcs.FITSFixedWarning",
    "ignore:'obsfix' made the change:astropy.wcs.FITSFixedWarning",
    "ignore:RADECSYS= :astropy.wcs.FITSFixedWarning",
]
